name: Actualizar observación SMN

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocarina-climatica-smn
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar registro SMN
        run: python scripts/ingest_smn_present.py

      - name: Publicar si cambió
        run: |
          git config user.name "ocarina-climatica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/smn-present.json
          git diff --cached --quiet && exit 0
          git commit -m "data: actualizar observación SMN"
          git push
