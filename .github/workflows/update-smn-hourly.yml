name: Actualizar serie horaria SMN

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocarina-climatica-smn-hourly
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ingestar serie horaria
        run: python scripts/ingest_smn_hourly.py
      - name: Construir archivo histórico mensual
        run: python scripts/archive_smn_hourly.py
      - name: Publicar si cambió
        run: |
          git config user.name "ocarina-climatica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/smn-hourly.json data/archive/smn-hourly
          git diff --cached --quiet && exit 0
          git commit -m "data: actualizar serie horaria SMN"
          git push
