name: V3.23 central-first QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check js/v3.23-central-repair.js
          node --check scripts/qa-v3.23-central.mjs
      - name: Central contract
        run: node scripts/qa-v3.23-central.mjs
      - name: Climate data contract
        run: python scripts/validate_climate.py
