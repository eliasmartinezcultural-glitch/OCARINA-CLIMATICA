name: Ocarina Climática · ingestión de fuentes
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Ingerir fuentes oficiales
        run: python scripts/ingest_climate.py
      - name: Publicar snapshots
        run: |
          git config user.name "ocarina-climatica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/
          if git diff --cached --quiet; then
            echo "Sin cambios de datos."
          else
            git commit -m "data: actualizar fuentes climáticas"
            git push
          fi
